<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="Actai — مساعدك الذكي لإنجاز أفكارك ومهامك.">
  <title>Actai — مساعدك الذكي</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">A</span><span>Actai</span></div>
      <button class="new-chat" id="newChat">＋ محادثة جديدة</button>
      <div class="side-label">مساحة العمل</div>
      <button class="side-link active">◉ المحادثة</button>
      <button class="side-link" data-tool="إنشاء فيلم">▣ إنشاء فيلم</button>
      <button class="side-link" data-tool="كتابة الكود">⌘ كتابة الكود</button>
      <button class="side-link" data-tool="إنشاء ملف">▤ إنشاء ملف</button>
      <div class="side-label history-label">المحادثات</div>
      <div id="history" class="history"></div>
      <div class="sidebar-footer"><span class="status-dot"></span> Actai — النسخة الأولية</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-menu" id="menuBtn" aria-label="القائمة">☰</button>
        <div class="model-name">Actai <span class="model-tag">مساعدك الذكي</span></div>
        <button class="icon-btn" id="clearBtn" title="محادثة جديدة" aria-label="محادثة جديدة">＋</button>
      </header>

      <section class="conversation" id="conversation">
        <div class="welcome" id="welcome">
          <div class="welcome-symbol">A</div>
          <p class="eyebrow">مساحة واحدة لكل أفكارك</p>
          <h1>مرحباً، أنا <span>Actai</span></h1>
          <p class="welcome-copy">اكتب ما تريد إنجازه، وسنبدأ بتحويل فكرتك إلى خطوات عملية.</p>
          <div class="suggestions">
            <button class="suggestion" data-prompt="ساعدني في كتابة فكرة فيلم سينمائي">🎬 <span>ابتكر فكرة فيلم</span></button>
            <button class="suggestion" data-prompt="أنشئ لي هيكل مشروع تطبيق ويب">⌘ <span>أنشئ مشروعاً برمجياً</span></button>
            <button class="suggestion" data-prompt="اكتب لي خطة عمل منظمة لمشروعي">✦ <span>خطط لمشروعي</span></button>
            <button class="suggestion" data-prompt="ساعدني في كتابة مستند احترافي">▤ <span>أنشئ مستنداً</span></button>
          </div>
        </div>
        <div class="messages" id="messages" aria-live="polite"></div>
      </section>

      <footer class="composer-area">
        <form class="composer" id="chatForm">
          <textarea id="prompt" rows="1" placeholder="اكتب أمرك إلى Actai..." aria-label="اكتب رسالتك"></textarea>
          <div class="composer-bottom">
            <span class="composer-hint">صف ما تريد بوضوح، وسنساعدك في تنفيذه</span>
            <button class="send-btn" id="sendBtn" type="submit" aria-label="إرسال">↑</button>
          </div>
        </form>
        <p class="disclaimer">Actai في مرحلة البناء — قد تحتاج بعض المهام إلى ربط خدمات ونماذج خارجية.</p>
      </footer>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
