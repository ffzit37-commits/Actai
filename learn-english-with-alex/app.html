<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101d32"><link rel="manifest" href="manifest.webmanifest"><title>Learn English With Alex</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f4f7;color:#1b2940;font-family:Tahoma,Arial,sans-serif}header{background:linear-gradient(135deg,#101d32,#28496c);color:#fff;padding:22px 5%;border-bottom:4px solid #d7b66d}h1{color:#f2d99e;direction:ltr;text-align:right;font-size:clamp(20px,4vw,30px);margin:0}header p{margin:8px 0 0;color:#dbe5f0}.wrap{max-width:1100px;margin:22px auto;padding:0 14px;display:grid;grid-template-columns:285px 1fr;gap:18px}.side,.main{background:white;border-radius:16px;padding:18px;box-shadow:0 6px 24px #172b4910}.side{height:max-content;position:sticky;top:10px;max-height:90vh;overflow:auto}.search{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;font:inherit}.filters{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}.filters button,.toc button,.nav button,.start{cursor:pointer;border:0;border-radius:8px;padding:9px}.filters button{background:#f2ead9}.filters .sel,.nav button,.start{background:#152b49;color:#fff}.toc{display:grid;gap:4px}.toc button{text-align:right;background:#fff;color:#354258}.toc button:hover,.toc .sel{background:#f4ead5}.intro{background:#fff8e9;border:1px solid #ead9b5;border-radius:13px;padding:20px;line-height:2}.intro h2{color:#183454}.lesson h2{margin:5px 0;color:#183454}.muted{color:#7b8798;font-size:13px}.arabic{background:#f5f8fc;border-right:4px solid #d7b66d;padding:17px;border-radius:10px;line-height:2;margin:18px 0}.example{direction:ltr;text-align:left;background:#f8f8f6;padding:16px;border-radius:10px;line-height:1.8}.nav{display:flex;justify-content:space-between;margin-top:20px;gap:10px}.nav button:disabled{opacity:.3}.index li{margin:7px 0}.index a{color:#28496c;text-decoration:none}.tag{display:inline-block;background:#f4ead5;color:#7b5d27;border-radius:20px;padding:5px 10px;font-size:12px}@media(max-width:760px){.wrap{grid-template-columns:1fr}.side{position:static;max-height:none}.toc{grid-template-columns:repeat(2,minmax(0,1fr));max-height:250px;overflow:auto}}@media(max-width:420px){.toc{grid-template-columns:1fr}}
</style></head><body><header><h1>LEARN ENGLISH WITH ALEX</h1><p>تطبيق تعلّم الإنجليزية من الصفر إلى B2 · شرح القواعد باللغة العربية</p></header><div class="wrap"><aside class="side"><h3>فهرس الدروس</h3><input id="q" class="search" placeholder="ابحث في الدروس..." oninput="draw()"><div class="filters"><button class="sel" data-l="all">الكل</button><button data-l="A1">A1</button><button data-l="A2">A2</button><button data-l="B1">B1</button><button data-l="B2">B2</button></div><div class="toc" id="toc"></div></aside><main class="main" id="main"></main></div><script>
const L=[["الحروف الإنجليزية والتهجئة","الأبجدية الإنجليزية 26 حرفاً. اسم الحرف قد يختلف عن صوته داخل الكلمة؛ تعلّم الحرف مع نطقه في كلمات حقيقية.","How do you spell your name? — A-L-E-X."],["التحيات والتعارف","Hello وHi للتحية. Good morning للصباح. للتعريف بنفسك قل I am… أو I’m… واستخدم Please وThank you للتأدب.","Hi, I’m Alex. Nice to meet you."],["الضمائر وفعل be","الضمائر: I أنا، you أنت، he هو، she هي، it لغير العاقل، we نحن، they هم. فعل be: I am، he/she/it is، you/we/they are. للنفي أضف not، وللسؤال قدّم am/is/are.","She is happy. Are you ready?"],["أدوات a وan وthe","a وan للمفرد المعدود غير المحدد؛ a قبل صوت ساكن وan قبل صوت متحرك. the لشيء معروف أو محدد. لا نستخدم أداة غالباً مع الجمع أو غير المعدود عند التعميم.","I saw a dog. The dog was black."],["الأسماء والجمع وأسماء الإشارة","معظم الجموع بإضافة s، وبعضها es أو ies، وهناك جموع شاذة مثل child/children. this/that للمفرد وthese/those للجمع.","This book is new. Those shoes are expensive."],["الملكية وفعل have","صفات الملكية تأتي قبل الاسم: my book. ضمائر الملكية تحل محل الاسم: mine. نستخدم have مع I/you/we/they وhas مع he/she/it.","This book is mine. She has a car."],["المضارع البسيط","للعادات والحقائق. مع he/she/it نضيف غالباً s. النفي don’t/doesn’t، والسؤال Do/Does ثم الفاعل والفعل الأساسي.","Does she work? He studies English."],["المضارع المستمر","am/is/are + فعل ing لحدث يقع الآن أو وضع مؤقت. لا نستخدمه عادةً مع أفعال الحالة مثل know وbelieve وwant.","I am studying now."],["تكوين الأسئلة","who من، what ماذا، where أين، when متى، why لماذا، how كيف. مع be نقول Where are you? ومع الأفعال نستخدم do/does/did.","Where do you live?"],["there is وthere are وحروف الجر","There is للمفرد وThere are للجمع بمعنى يوجد. at للساعة، on للأيام، in للأشهر والسنوات. in داخل، on على، under تحت.","There are two cafés. The keys are on the table."],["الماضي البسيط","لحدث انتهى في الماضي. المنتظم يضيف ed، وغير المنتظم يتغير مثل go/went. النفي didn’t + المصدر، والسؤال Did + الفاعل + المصدر.","I went to school yesterday."],["الماضي المستمر","was/were + ing لوصف حدث كان جارياً في وقت ماضٍ. يمكن أن يقطعه حدث بالماضي البسيط.","I was sleeping when he called."],["المستقبل: will وgoing to","will للقرار اللحظي أو التوقع. going to للخطة أو التوقع المبني على دليل.","I will help you. I’m going to study."],["الأسماء المعدودة وغير المعدودة","المعدود له مفرد وجمع مثل books. غير المعدود مثل water وinformation لا يجمع عادةً ولا يأتي مع a/an.","Some water; three books."],["some وany وmuch وmany","some غالباً في الإثبات وany في النفي والسؤال. many مع المعدود، much مع غير المعدود، a lot of مع الاثنين.","How many books? How much water?"],["المقارنة والتفضيل","للمقارنة بين اثنين نستخدم -er أو more ثم than. للتفضيل داخل مجموعة نستخدم the -est أو the most.","Ali is taller than Omar. She is the tallest."],["الأفعال الناقصة","بعد can/could/may/might يأتي الفعل الأساسي دون to. can للقدرة، could للطلب المهذب أو الماضي، may/might للاحتمال أو الإذن.","Could you help me? It might rain."],["الأوامر والتعليمات","الأمر يتكون من الفعل الأساسي. للنهي نستخدم Don’t + الفعل. أضف please للتهذيب.","Open the door, please. Don’t run."],["المضارع التام","have/has + التصريف الثالث، ويربط الماضي بالحاضر أو يصف تجربة دون تحديد وقت منتهٍ.","I have visited Algiers."],["المضارع التام المستمر","have/has been + ing للتركيز على مدة النشاط أو استمراره. for للمدة وsince لنقطة البداية.","I have been studying for two hours."],["الماضي التام","had + التصريف الثالث لحدث وقع قبل حدث آخر في الماضي.","She had left before I arrived."],["الشرط الصفري والأول","الصفري للحقائق: If + present, present. الأول لاحتمال مستقبلي: If + present, will + verb. لا نضع will عادةً داخل if.","If it rains, we will stay home."],["الشرط الثاني والثالث","الثاني لفرضية غير واقعية: If + past, would + verb. الثالث لشيء لم يحدث في الماضي: If + had + V3, would have + V3.","If I had money, I would travel."],["المبني للمجهول","نستخدمه عندما يكون الفعل أو النتيجة أهم من الفاعل. الصيغة be + التصريف الثالث، ويتغير be حسب الزمن.","The house was built in 1990."],["الكلام المنقول","ننقل كلام شخص دون اقتباس مباشر. بعد فعل نقل ماضٍ يرجع الزمن غالباً خطوة، وتتغير الضمائر وظروف الزمان والمكان.","He said he was tired."],["جمل الوصل","who للأشخاص، which للأشياء، that للأشخاص أو الأشياء في جمل التحديد، where للأماكن. تضيف معلومات عن الاسم.","The woman who called is my teacher."],["المصدر واسم الفعل","gerund هو فعل + ing يعمل كاسم. infinitive هو to + المصدر. بعض الأفعال تتبعها صيغة محددة؛ احفظ الفعل مع نمطه.","Swimming is fun. I want to learn."],["الأفعال المركبة","تتكون من فعل وكلمة صغيرة تغير المعنى. احفظها داخل جملة لأن معناها قد لا يكون حرفياً.","give up = يستسلم; look after = يعتني بـ."],["المفردات: الأشخاص والصفات","تعلم الصفات ضمن سياق: kind لطيف، reliable موثوق، confident واثق. استخدم be لوصف الشخص.","She is kind and reliable."],["المفردات: العمل والدراسة والمال","فرّق بين job وظيفة وwork عمل وcareer مسار مهني، وبين salary راتب وwage أجر.","I applied for a job."],["المفردات: السفر والخدمات","تدرب على مفردات المطار والفندق والاتجاهات والطلب المهذب.","Could I book a room?"],["المفردات: الصحة ونمط الحياة","تعلم أسماء الأعراض والعادات الصحية. هذه مفردات لغوية وليست تشخيصاً طبياً.","I have a headache."],["المفردات: التكنولوجيا والإعلام","device جهاز، account حساب، password كلمة مرور، upload يرفع، download ينزّل. privacy الخصوصية وsecurity الأمان.","Please download the file."],["المفردات: المشاعر والآراء","استعمل كلمات دقيقة بدلاً من good وbad، مثل useful وexcellent وharmful وdisappointing.","I was disappointed with the result."],["المتلازمات اللفظية","هي كلمات تأتي معاً بصورة طبيعية. تعلم التعبير كاملاً بدلاً من ترجمة كل كلمة منفردة.","make a decision; do homework; heavy rain."],["اشتقاق الكلمات","السوابق مثل un- وre- تأتي أول الكلمة، واللواحق مثل -ness و-ment و-ful في آخرها. قد تغير المعنى أو نوع الكلمة.","happy → unhappy; kind → kindness."],["النطق وربط الكلمات","ركز على وضوح النطق ومقاطع الكلمة والنبر. استمع إلى جملة ثم قلّدها بصوت مرتفع.","Listen, repeat, and record yourself."],["استراتيجيات الاستماع","استمع أولاً للفكرة العامة ثم أعد الاستماع للتفاصيل. لا تتوقف عند كل كلمة مجهولة؛ خمّن من السياق.","Listen twice: first for the main idea, then for details."],["التحدث بطلاقة","تحدث يومياً حتى مع وجود أخطاء. استخدم روابط مثل first وbecause وhowever، وسجّل صوتك لتحسين نقطة واحدة كل مرة.","In my opinion… because… however…"],["مهارات القراءة","حدد هدف القراءة، تصفح العناوين، ثم ابحث عن التفاصيل. استخدم الكلمات المحيطة لفهم المفردات الجديدة.","Read for the main idea before details."],["كتابة فقرات واضحة","الفقرة تتضمن فكرة رئيسية وجملاً داعمة وخاتمة أو انتقالاً. استخدم روابط لتنظيم الأفكار.","First… Also… For example… Therefore…"],["الرسائل والبريد الإلكتروني","اختر الرسمية حسب المتلقي. في الرسمي: Dear… وCould you please… وKind regards. في غير الرسمي: Hi… وSee you.","Could you please send me the details?"],["التعبير عن الرأي ودعمه – B2","في B2 اذكر موقفك وأسبابه ومثالاً، واعترف بوجهة نظر أخرى ورد عليها بأدب.","I see your point; however, I believe…"],["الجمل المركبة والتوكيد – B2","Although تتبعها جملة، أما despite فيتبعها اسم أو ing. so that للغرض، وso…that للنتيجة. التقديم العكسي أسلوب توكيدي رسمي.","Although it was late, we continued."],["الأسلوب الرسمي وغير الرسمي – B2","الرسمي للعمل والطلبات، وغير الرسمي للأصدقاء. اختر الوضوح ولا تستخدم كلمات معقدة لمجرد أنها تبدو متقدمة.","Could you please forward the document?"],["أخطاء نحوية شائعة","قل He goes وليس He go؛ I agree وليس I am agree؛ I am 20 years old وليس I have 20 years. احفظ حروف الجر مع التعبير.","She is interested in music."],["مراجعة نهائية واختبار","اختبر نفسك دون الرجوع للدروس. بعد التصحيح اكتب سبب الخطأ ومثالاً جديداً. هذا تدريب وليس امتحان CEFR رسمياً.","Review, correct, and make your own examples."],["الإجابات والخطوات التالية","راجع الإجابات بعد إنهاء الاختبار. خصص أياماً للقواعد والاستماع والقراءة والتحدث والكتابة، واطلب ملاحظات على إنتاجك.","Practise a little every day."],["تحدي الإنجليزية لمدة 30 يوماً","اجعل التعلم عادة يومية قصيرة. كل يوم مهمة واحدة: كلمات أو قواعد أو استماع أو محادثة أو كتابة. قيّم تقدمك في نهاية الشهر.","Day 1: introduce yourself. Day 2: learn 15 words."]];
let active=-1,lev='all';
function level(i){return i<10?'A1':i<18?'A2':i<28?'B1':'B2'}
function draw(){let q=document.getElementById('q').value.toLowerCase();document.getElementById('toc').innerHTML=L.map((x,i)=>({x,i})).filter(o=>(lev==='all'||level(o.i)===lev)&&(!q||(o.x[0]+o.x[1]).toLowerCase().includes(q))).map(o=>'<button class="'+(active===o.i?'sel':'')+'" onclick="openLesson('+o.i+')">'+(o.i+1)+'. '+o.x[0]+'</button>').join('')}
function intro(){active=-1;draw();document.getElementById('main').innerHTML='<section class="intro"><span class="tag">مرحباً بك</span><h2>مقدمة الكتاب</h2><p>أهلاً بك في رحلتك مع الإنجليزية! صُمّم هذا التطبيق لينقلك تدريجياً من الحروف والكلمات الأساسية إلى القواعد والمهارات المتقدمة حتى مستوى B2. ستجد شرحاً عربياً مبسطاً، وأمثلة إنجليزية لتتعلم كيف تستخدم القاعدة في الحياة اليومية.</p><p><b>كيف تستفيد من التطبيق؟</b> اقرأ الشرح العربي، انطق المثال الإنجليزي، اكتب ثلاثة أمثلة من عندك، ثم راجع الدرس في اليوم التالي. خصص وقتاً للاستماع والتحدث والقراءة والكتابة، ولا تخف من الأخطاء.</p><h2>الفهرس العربي</h2><ol class="index">'+L.map((x,i)=>'<li><a href="#" onclick="openLesson('+i+');return false">'+x[0]+'</a> <small>— '+level(i)+'</small></li>').join('')+'</ol><p><b>تنبيه:</b> هذا منهج ذاتي للتدريب وليس امتحاناً رسمياً أو ضماناً للحصول على مستوى B2؛ الوصول إليه يحتاج ممارسة منتظمة وتقييماً للمهارات الأربع.</p><button class="start" onclick="openLesson(0)">ابدأ من الدرس الأول</button></section>'}
function openLesson(i){active=Math.max(0,Math.min(L.length-1,i));draw();let x=L[active];document.getElementById('main').innerHTML='<div class="lesson"><span class="tag">المستوى '+level(active)+'</span><p class="muted">LESSON '+(active+1)+' / '+L.length+'</p><h2>'+x[0]+'</h2><section class="arabic"><b>الشرح بالعربية</b><p>'+x[1]+'</p></section><section class="example"><b>English example</b><p>'+x[2]+'</p></section><div class="nav"><button onclick="openLesson('+Math.max(0,active-1)+')" '+(active===0?'disabled':'')+'>الدرس السابق ←</button><button onclick="openLesson('+Math.min(L.length-1,active+1)+')" '+(active===L.length-1?'disabled':'')+'>الدرس التالي →</button></div></div>';window.scrollTo(0,0)}
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{lev=b.dataset.l;document.querySelectorAll('.filters button').forEach(x=>x.classList.toggle('sel',x===b));draw()});intro();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script></body></html>
